<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(245,158,11,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Фон -->
  <rect width="1200" height="400" fill="url(#bg)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Декоративные линии и плашки -->
  <path d="M0 380 L1200 380" stroke="#F59E0B" stroke-width="4" opacity="0.8"/>
  <rect x="0" y="384" width="1200" height="16" fill="repeating-linear-gradient(-45deg, #F59E0B 0, #F59E0B 14px, #0D1117 14px, #0D1117 28px)" opacity="0.7"/>

  <!-- Светящийся акцент позади текста -->
  <circle cx="250" cy="200" r="180" fill="#F59E0B" opacity="0.12" filter="blur(60px)"/>

  <!-- Иконка / Логотип -->
  <g transform="translate(80, 110)">
    <rect width="80" height="80" rx="14" fill="url(#acc)" />
    <text x="40" y="58" font-family="Inter, sans-serif" font-weight="800" font-size="46" fill="#0D1117" text-anchor="middle">T</text>
  </g>

  <!-- Заголовок и подзаголовок -->
  <text x="190" y="152" font-family="Inter, sans-serif" font-weight="800" font-size="42" fill="#F0F6FC" letter-spacing="1">
    TEHNIK <tspan fill="#F59E0B">PRO</tspan>
  </text>
  
  <text x="192" y="192" font-family="Inter, sans-serif" font-weight="500" font-size="18" fill="rgba(240,246,252,0.7)">
    Профессиональная аренда спецтехники с подачей на объект за 2 часа
  </text>

  <!-- Плашки с ключевыми фичами (бэйджи на баннере) -->
  <g transform="translate(192, 230)">
    <!-- Бэйджик 1 -->
    <rect x="0" y="0" width="160" height="40" rx="8" fill="rgba(22,27,34,0.8)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <text x="80" y="25" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#F59E0B" text-anchor="middle">⚡ Подача от 2ч</text>

    <!-- Бэйджик 2 -->
    <rect x="175" y="0" width="150" height="40" rx="8" fill="rgba(22,27,34,0.8)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <text x="250" y="25" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#F0F6FC" text-anchor="middle">🛡️ 24/7 Сервис</text>

    <!-- Бэйджик 3 -->
    <rect x="340" y="0" width="160" height="40" rx="8" fill="rgba(22,27,34,0.8)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <text x="420" y="25" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#F59E0B" text-anchor="middle">📋 Работа с НДС</text>
  </g>

  <!-- Силуэт экскаватора/крана справа для красоты -->
  <g transform="translate(880, 120)" fill="#F59E0B" opacity="0.15">
    <path d="M20 180 L80 180 L90 140 L160 140 L180 80 L230 40 L260 60 L230 100 L170 140 L150 180 L220 180 L230 200 L10 200 L20 180 Z"/>
    <circle cx="50" cy="200" r="22" fill="#0D1117" stroke="#F59E0B" stroke-width="8"/>
    <circle cx="180" cy="200" r="22" fill="#0D1117" stroke="#F59E0B" stroke-width="8"/>
  </g>
</svg>
